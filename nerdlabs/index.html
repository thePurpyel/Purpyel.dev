<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NerdLabs AI — Purpyel</title>
<link rel="icon" type="image/png" href="/assets/purpyel-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:           #0d0d10;
    --bg2:          #16161c;
    --bg3:          #1e1e27;
    --border:       rgba(255,255,255,0.08);
    --border2:      rgba(255,255,255,0.15);
    --text:         #e8e8f0;
    --muted:        #8888a4;
    --accent:       #9900ff;
    --accent2:      #7c5cfc;
    --accent-glow:  rgba(153, 0, 255, 0.35);
    --radius:       4px 14px 6px 10px / 8px 4px 12px 6px;
    --radius-sm:    3px 8px 5px 6px / 6px 3px 8px 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Azeret Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 15px;
    line-height: 1.7;
    padding-top: 62px;
  }

  a { color: inherit; text-decoration: none; }
  img { display: block; width: 100%; }

  /* ── canvas + noise ── */
  #network-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  body > *:not(#network-canvas):not(nav):not(.nav-mobile-menu) { position: relative; z-index: 1; }

  /* ── nav ── */
  nav {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    z-index: 100;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(13,13,16,0.88);
    border-bottom: 1.5px solid rgba(153,0,255,0.15);
    padding: 0 2rem;
    height: 62px;
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    flex-shrink: 0;
    transform: rotate(-1deg);
    transition: transform 0.2s;
  }
  .nav-logo:hover { transform: rotate(0.5deg) scale(1.04); }
  .nav-logo img {
    width: 32px;
    height: 32px;
    border-radius: 8px 4px 8px 4px;
    object-fit: cover;
  }

  .nav-tabs {
    display: flex;
    gap: 0.25rem;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-tab {
    padding: 4px 14px;
    font-size: 13px;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.2s, background 0.2s;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    background: transparent;
    border-radius: 3px 8px 4px 6px / 5px 3px 7px 4px;
    position: relative;
    letter-spacing: 0.02em;
  }
  .nav-tab::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 10%;
    width: 0%;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.25s ease;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab:hover::after { width: 80%; }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active::after { width: 80%; }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 36px;
    height: 36px;
    padding: 5px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 4px 10px 5px 8px / 8px 4px 10px 5px;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: auto;
    transition: border-color 0.2s;
  }
  .nav-hamburger:hover { border-color: rgba(153,0,255,0.5); }
  .nav-hamburger span {
    display: block;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s ease;
    transform-origin: center;
  }
  .nav-hamburger span:nth-child(2) { width: 75%; }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .nav-mobile-menu {
    display: none;
    position: fixed;
    top: 62px; left: 0;
    width: 100%;
    z-index: 99;
    background: rgba(13,13,16,0.97);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1.5px solid rgba(153,0,255,0.2);
    padding: 0.75rem 1rem 1rem;
    transform: translateY(-8px);
    opacity: 0;
    transition: transform 0.22s ease, opacity 0.22s ease;
    pointer-events: none;
  }
  .nav-mobile-menu.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .nav-mobile-item {
    display: block;
    width: 100%;
    padding: 0.75rem 0.5rem;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    text-align: left;
    letter-spacing: 0.02em;
    transition: color 0.2s, padding-left 0.2s;
  }
  .nav-mobile-item:last-child { border-bottom: none; }
  .nav-mobile-item:hover { color: var(--text); padding-left: 1rem; }
  .nav-mobile-item.active { color: var(--accent); }

  /* ── main ── */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 4rem 2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 62px - 80px);
  }

  /* ── card ── */
  .card {
    background: var(--bg2);
    border: 1.5px solid rgba(153,0,255,0.2);
    border-radius: 6px 20px 8px 16px / 12px 6px 18px 8px;
    padding: 3rem 3.2rem 2.8rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow:
      5px 6px 0 0 rgba(153,0,255,0.1),
      -1px -1px 0 0 rgba(124,92,252,0.06),
      0 0 60px rgba(153,0,255,0.06);
    transform: rotate(-0.3deg);
    position: relative;
    animation: fadeUp 0.55s ease both;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -70px; right: -50px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
    opacity: 0.06;
    pointer-events: none;
  }

  .card::after {
    content: '✦';
    position: absolute;
    bottom: 1.1rem; right: 1.4rem;
    font-size: 0.9rem;
    color: var(--accent2);
    opacity: 0.28;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px) rotate(-0.3deg); }
    to   { opacity: 1; transform: translateY(0)   rotate(-0.3deg); }
  }

  /* logo block */
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 1.8rem;
  }

  .logo-img {
    width: 64px;
    height: 64px;
    border-radius: 10px 5px 12px 6px / 6px 12px 5px 10px;
    border: 2px solid rgba(153,0,255,0.3);
    background: var(--bg3);
    object-fit: cover;
    transform: rotate(1.5deg);
    box-shadow: 3px 3px 0 rgba(153,0,255,0.15);
    flex-shrink: 0;
  }

  .logo-text { text-align: left; }

  .logo-eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent2);
    opacity: 0.85;
    font-weight: 400;
    margin-bottom: 3px;
  }

  .logo-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.0;
  }

  .divider {
    width: 100%;
    height: 1.5px;
    background: rgba(153,0,255,0.12);
    clip-path: polygon(0 0,2% 100%,4% 0,6% 100%,8% 0,10% 100%,12% 0,14% 100%,16% 0,18% 100%,20% 0,22% 100%,24% 0,26% 100%,28% 0,30% 100%,32% 0,34% 100%,36% 0,38% 100%,40% 0,42% 100%,44% 0,46% 100%,48% 0,50% 100%,52% 0,54% 100%,56% 0,58% 100%,60% 0,62% 100%,64% 0,66% 100%,68% 0,70% 100%,72% 0,74% 100%,76% 0,78% 100%,80% 0,82% 100%,84% 0,86% 100%,88% 0,90% 100%,92% 0,94% 100%,96% 0,98% 100%,100% 0,100% 100%,0 100%);
    margin: 0 0 1.8rem;
  }

  .desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.85;
    margin-bottom: 2rem;
  }

  /* link buttons */
  .links { display: flex; flex-direction: column; gap: 0.75rem; }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 22px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    border-radius: 4px 12px 5px 10px / 10px 4px 12px 5px;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    text-decoration: none;
  }

  /* icon sizing — matches the footer-links img pattern */
  .link-btn img {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    filter: brightness(0) invert(1);
  }

  .link-btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.3);
  }
  .link-btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-2px) rotate(0.3deg);
    box-shadow: 4px 6px 0 rgba(0,0,0,0.3), 0 0 20px var(--accent-glow);
  }

  .link-btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1.5px solid rgba(153,0,255,0.3);
    box-shadow: 2px 3px 0 rgba(153,0,255,0.08);
  }
  .link-btn-secondary:hover {
    border-color: rgba(153,0,255,0.6);
    transform: translateY(-2px) rotate(-0.3deg);
    box-shadow: 3px 5px 0 rgba(153,0,255,0.15);
  }

  /* ── footer (identical to index.html) ── */
  footer {
    border-top: 1.5px solid rgba(153,0,255,0.12);
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    max-width: 920px;
    margin: 0 auto;
  }

  .footer-brand {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--muted);
    display: inline-block;
  }

  .footer-links {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .footer-links img {
    width: 18px;
    height: 18px;
    filter: brightness(0) invert(1) opacity(0.55);
    transition: filter 0.2s;
  }

  .footer-sep { color: rgba(255,255,255,0.15); font-size: 12px; }

  .footer-link {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 3px 8px 4px 6px / 6px 3px 8px 4px;
    border: 1px solid var(--border);
    transition: color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .footer-link:hover {
    color: var(--text);
    border-color: rgba(153,0,255,0.3);
    transform: translateY(-1px);
  }
  .footer-link:hover img { filter: brightness(0) invert(1) opacity(0.9); }
  .footer-link svg { width: 15px; height: 15px; }

  @media (max-width: 640px) {
    nav { padding: 0 1rem; gap: 1rem; }
    main { padding: 2rem 1rem; }
    footer { padding: 2rem 1rem; }
    .nav-tabs { display: none; }
    .nav-hamburger { display: flex; }
    .nav-mobile-menu { display: block; }
    .card { padding: 2.2rem 1.6rem 2rem; }
    .logo-title { font-size: 1.65rem; }
  }
</style>
</head>
<body>

<canvas id="network-canvas"></canvas>

<script>
const ICONS = {
  github:  `<img src="/assets/github.svg"  alt="GitHub">`,
  discord: `<img src="/assets/discord.svg" alt="Discord">`,
  twitter: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.259 5.629L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>`,
};

const SOCIALS = [
  { label: "GitHub",  icon: "github",  url: "https://github.com/thePurpyel" },
  { label: "Discord", icon: "discord", url: "https://discord.gg/rkSKtdW99R" },
];

const NAV_TABS = [
  { label: "Home",        url: "/" },
  { label: "NerdLabs AI", url: "/nerdlabs", active: true },
  { label: "WaterBot",    url: "/waterbot" },
];
</script>

<nav>
  <a href="/" class="nav-logo">
    <img src="/assets/purpyel-logo.svg" alt="Purpyel">
  </a>
  <div class="nav-tabs" id="nav-tabs"></div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile-menu" id="nav-mobile-menu" aria-hidden="true">
  <div id="nav-mobile-inner"></div>
</div>

<main>
  <div class="card">
    <div class="logo-wrap">
      <img src="/assets/nerdlabs-square.avif" alt="NerdLabs AI" class="logo-img"
           onerror="this.style.display='none'">
      <div class="logo-text">
        <div class="logo-eyebrow">// organisation</div>
        <div class="logo-title">NerdLabs AI</div>
      </div>
    </div>

    <div class="divider"></div>

    <p class="desc">
      NerdLabs AI is an organisation for Discord-related projects and bots,
      like WaterBot and AI Nerd.
    </p>

    <div class="links">
      <a class="link-btn link-btn-primary"
         href="https://discord.gg/rkSKtdW99R"
         target="_blank" rel="noopener">
        <img src="/assets/discord.svg" alt="Discord">
        Join the Discord
      </a>

      <a class="link-btn link-btn-secondary"
         href="https://github.com/Nerdlabs-AI-DC"
         target="_blank" rel="noopener">
        <img src="/assets/github.svg" alt="GitHub">
        GitHub Organisation
      </a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-brand">Purpyel</div>
  <div class="footer-links" id="footer-links"></div>
</footer>

<script>
// ── nav ──
const navTabs        = document.getElementById('nav-tabs');
const navMobileInner = document.getElementById('nav-mobile-inner');

function navTabAction(url, e) {
  if (url.startsWith('#')) {
    document.getElementById(url.slice(1))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    url.startsWith('http') ? window.open(url, '_blank', 'noopener') : window.location.href = url;
  }
  closeMobileMenu();
  document.querySelectorAll('.nav-tab, .nav-mobile-item').forEach(t => t.classList.remove('active'));
  e?.currentTarget?.classList.add('active');
}

NAV_TABS.forEach(tab => {
  const btn = document.createElement('button');
  btn.className = 'nav-tab' + (tab.active ? ' active' : '');
  btn.textContent = tab.label;
  btn.addEventListener('click', e => navTabAction(tab.url, e));
  navTabs.appendChild(btn);

  const mBtn = document.createElement('button');
  mBtn.className = 'nav-mobile-item' + (tab.active ? ' active' : '');
  mBtn.textContent = tab.label;
  mBtn.addEventListener('click', e => navTabAction(tab.url, e));
  navMobileInner.appendChild(mBtn);
});

const hamburger  = document.getElementById('nav-hamburger');
const mobileMenu = document.getElementById('nav-mobile-menu');

function closeMobileMenu() {
  hamburger.classList.remove('open');
  mobileMenu.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  mobileMenu.setAttribute('aria-hidden', 'true');
}

hamburger.addEventListener('click', () => {
  const isOpen = mobileMenu.classList.contains('open');
  if (isOpen) { closeMobileMenu(); }
  else {
    hamburger.classList.add('open');
    mobileMenu.classList.add('open');
    hamburger.setAttribute('aria-expanded', 'true');
    mobileMenu.setAttribute('aria-hidden', 'false');
  }
});

document.addEventListener('click', e => {
  if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
});

// ── footer ──
const footerLinks = document.getElementById('footer-links');
SOCIALS.forEach((s, i) => {
  if (i > 0) {
    const sep = document.createElement('span');
    sep.className = 'footer-sep';
    sep.textContent = '|';
    footerLinks.appendChild(sep);
  }
  const a = document.createElement('a');
  a.className = 'footer-link';
  a.href = s.url;
  if (s.url.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = `${ICONS[s.icon] || ''} ${s.label}`;
  footerLinks.appendChild(a);
});

// ── particle network ──
(function initNetwork() {
  const canvas = document.getElementById('network-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const COUNT = 55, MAX_DIST = 140;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

  function makeParticle() {
    return {
      x:  Math.random() * canvas.width,
      y:  Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.38,
      vy: (Math.random() - 0.5) * 0.38,
      r:  Math.random() * 1.8 + 0.6
    };
  }

  function init() { resize(); particles = []; for (let i = 0; i < COUNT; i++) particles.push(makeParticle()); }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MAX_DIST) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(153,0,255,${(1 - dist / MAX_DIST) * 0.22})`;
          ctx.lineWidth = 0.8;
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124,92,252,0.55)';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init(); draw();
})();
</script>

</body>
</html>
