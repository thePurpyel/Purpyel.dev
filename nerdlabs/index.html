<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NerdLabs AI — Purpyel</title>
<link rel="icon" type="image/png" href="/assets/purpyel-logo.svg">
<link rel="stylesheet" href="/shared.css">

<style>
  main {
    max-width: 900px;
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 60px - 82px);
  }

  /* ── Centered info card ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 3rem 3.2rem 2.8rem;
    max-width: 480px; width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.28);
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-wrap {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 1.8rem;
  }
  .logo-img {
    width: 60px; height: 60px;
    border-radius: var(--radius);
    border: 1px solid rgba(153,0,255,0.25);
    background: var(--bg3); object-fit: cover; flex-shrink: 0;
  }
  .logo-text { text-align: left; }
  .logo-eyebrow {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent2); opacity: 0.85; font-weight: 400; margin-bottom: 3px;
    font-family: 'Azeret Mono', monospace;
  }
  .logo-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 2rem; font-weight: 700; letter-spacing: 0.01em; line-height: 1.0;
  }

  .divider {
    width: 100%; height: 1px;
    background: rgba(153,0,255,0.12); margin: 0 0 1.8rem;
  }

  .desc {
    color: var(--muted); font-size: 13px;
    line-height: 1.85; margin-bottom: 2rem;
  }

  .links { display: flex; flex-direction: column; gap: 0.75rem; }

  .link-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 22px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1rem; font-weight: 600; letter-spacing: 0.03em;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    text-decoration: none;
  }
  .link-btn img { width: 18px; height: 18px; flex-shrink: 0; filter: brightness(0) invert(1); }

  .link-btn-primary {
    background: var(--accent); color: #fff; border: none;
    box-shadow: 0 2px 12px rgba(153,0,255,0.35);
  }
  .link-btn-primary:hover {
    opacity: 0.9; transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(153,0,255,0.45);
  }
  .link-btn-secondary {
    background: transparent; color: var(--text);
    border: 1.5px solid rgba(153,0,255,0.3);
  }
  .link-btn-secondary:hover {
    border-color: rgba(153,0,255,0.6); transform: translateY(-2px);
  }

  @media (max-width: 640px) {
    .card { padding: 2.2rem 1.6rem 2rem; }
    .logo-title { font-size: 1.65rem; }
  }
</style>
</head>
<body>

<script src="/shared.js"></script>

<nav>
  <a href="/" class="nav-logo">
    <img src="/assets/purpyel-logo.svg" alt="Purpyel">
  </a>
  <div class="nav-tabs" id="nav-tabs"></div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile-menu" id="nav-mobile-menu" aria-hidden="true">
  <div id="nav-mobile-inner"></div>
</div>

<main>
  <div class="card">
    <div class="logo-wrap">
      <img src="/assets/nerdlabs-square.avif" alt="NerdLabs AI" class="logo-img"
           onerror="this.style.display='none'">
      <div class="logo-text">
        <div class="logo-eyebrow">// organisation</div>
        <div class="logo-title">NerdLabs AI</div>
      </div>
    </div>

    <div class="divider"></div>

    <p class="desc">
      NerdLabs AI is an organisation for Discord-related projects and bots,
      like WaterBot and AI Nerd.
    </p>

    <div class="links">
      <a class="link-btn link-btn-primary"
         href="https://discord.gg/rkSKtdW99R"
         target="_blank" rel="noopener">
        <img src="/assets/discord.svg" alt="Discord">
        Join the Discord
      </a>
      <a class="link-btn link-btn-secondary"
         href="https://github.com/Nerdlabs-AI-DC"
         target="_blank" rel="noopener">
        <img src="/assets/github.svg" alt="GitHub">
        GitHub Organisation
      </a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-brand" id="footer-brand"></div>
  <div class="footer-links" id="footer-links"></div>
</footer>

<script>
initShared();
</script>
</body>
</html>
