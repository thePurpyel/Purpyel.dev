<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Protogen — Purpyel</title>
        <link rel="icon" type="image/png" href="/assets/purpyel-logo.svg" />
        <link
            href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Azeret+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg: #0d0d10;
                --bg2: #16161c;
                --bg3: #1e1e27;
                --border: rgba(255, 255, 255, 0.08);
                --border2: rgba(255, 255, 255, 0.15);
                --text: #e8e8f0;
                --muted: #8888a4;
                --accent: #9900ff;
                --accent2: #7c5cfc;
                --accent-glow: rgba(153, 0, 255, 0.35);
                --radius: 4px 14px 6px 10px / 8px 4px 12px 6px;
                --radius-sm: 3px 8px 5px 6px / 6px 3px 8px 4px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family: "Azeret Mono", monospace;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                overflow-x: hidden;
                font-size: 15px;
                line-height: 1.7;
            }
            a {
                color: inherit;
                text-decoration: none;
            }
            img {
                display: block;
                width: 100%;
            }

            #network-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                opacity: 0.45;
                pointer-events: none;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
                background-size: 200px 200px;
                pointer-events: none;
                z-index: 0;
                opacity: 0.6;
            }

            body > *:not(#network-canvas):not(nav):not(.nav-mobile-menu) {
                position: relative;
                z-index: 1;
            }

            /* ── NAV (identical to index.html) ── */
            nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                background: rgba(13, 13, 16, 0.88);
                border-bottom: 1.5px solid rgba(153, 0, 255, 0.15);
                padding: 0 2rem;
                height: 62px;
                display: flex;
                align-items: center;
                gap: 2rem;
            }
            body {
                padding-top: 62px;
            }
            .nav-logo {
                display: flex;
                align-items: center;
                gap: 10px;
                font-family: "Josefin Sans", sans-serif;
                font-weight: 700;
                font-size: 1.4rem;
                letter-spacing: 0.01em;
                flex-shrink: 0;
                transform: rotate(-1deg);
                transition: transform 0.2s;
            }
            .nav-logo:hover {
                transform: rotate(0.5deg) scale(1.04);
            }
            .nav-logo img {
                width: 32px;
                height: 32px;
                border-radius: 8px 4px 8px 4px;
                object-fit: cover;
            }
            .nav-tabs {
                display: flex;
                gap: 0.25rem;
                overflow-x: auto;
                scrollbar-width: none;
                flex: 1;
            }
            .nav-tabs::-webkit-scrollbar {
                display: none;
            }
            .nav-tab {
                padding: 4px 14px;
                font-size: 13px;
                font-family: "Josefin Sans", sans-serif;
                font-weight: 600;
                color: var(--muted);
                transition:
                    color 0.2s,
                    background 0.2s;
                white-space: nowrap;
                cursor: pointer;
                border: none;
                background: transparent;
                border-radius: 3px 8px 4px 6px / 5px 3px 7px 4px;
                position: relative;
                letter-spacing: 0.02em;
            }
            .nav-tab::after {
                content: "";
                position: absolute;
                bottom: -2px;
                left: 10%;
                width: 0%;
                height: 2px;
                background: var(--accent);
                border-radius: 2px;
                transition: width 0.25s ease;
            }
            .nav-tab:hover {
                color: var(--text);
            }
            .nav-tab:hover::after {
                width: 80%;
            }
            .nav-tab.active {
                color: var(--accent);
            }
            .nav-tab.active::after {
                width: 80%;
            }

            .nav-hamburger {
                display: none;
                flex-direction: column;
                justify-content: center;
                gap: 5px;
                width: 36px;
                height: 36px;
                padding: 5px;
                background: transparent;
                border: 1px solid var(--border2);
                border-radius: 4px 10px 5px 8px / 8px 4px 10px 5px;
                cursor: pointer;
                flex-shrink: 0;
                margin-left: auto;
                transition: border-color 0.2s;
            }
            .nav-hamburger:hover {
                border-color: rgba(153, 0, 255, 0.5);
            }
            .nav-hamburger span {
                display: block;
                height: 2px;
                background: var(--text);
                border-radius: 2px;
                transition:
                    transform 0.25s ease,
                    opacity 0.25s ease,
                    width 0.25s ease;
                transform-origin: center;
            }
            .nav-hamburger span:nth-child(2) {
                width: 75%;
            }
            .nav-hamburger.open span:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .nav-hamburger.open span:nth-child(2) {
                opacity: 0;
                width: 0;
            }
            .nav-hamburger.open span:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }

            .nav-mobile-menu {
                display: none;
                position: fixed;
                top: 62px;
                left: 0;
                width: 100%;
                z-index: 99;
                background: rgba(13, 13, 16, 0.97);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border-bottom: 1.5px solid rgba(153, 0, 255, 0.2);
                padding: 0.75rem 1rem 1rem;
                transform: translateY(-8px);
                opacity: 0;
                transition:
                    transform 0.22s ease,
                    opacity 0.22s ease;
                pointer-events: none;
            }
            .nav-mobile-menu.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .nav-mobile-item {
                display: block;
                width: 100%;
                padding: 0.75rem 0.5rem;
                font-family: "Josefin Sans", sans-serif;
                font-size: 1.05rem;
                font-weight: 600;
                color: var(--muted);
                background: transparent;
                border: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                cursor: pointer;
                text-align: left;
                letter-spacing: 0.02em;
                transition:
                    color 0.2s,
                    padding-left 0.2s;
            }
            .nav-mobile-item:last-child {
                border-bottom: none;
            }
            .nav-mobile-item:hover {
                color: var(--text);
                padding-left: 1rem;
            }
            .nav-mobile-item.active {
                color: var(--accent);
            }

            /* ── LAYOUT ── */
            main {
                max-width: 920px;
                margin: 0 auto;
                padding: 4rem 2rem 2rem;
            }

            /* ── HERO BANNER ── */
            #banner-section {
                margin-bottom: 4rem;
            }
            .hero {
                position: relative;
                padding: 3.5rem 2.5rem 3rem;
                background: var(--bg2);
                border: 1.5px solid rgba(153, 0, 255, 0.2);
                border-radius: 4px 18px 8px 14px / 10px 6px 16px 4px;
                overflow: hidden;
                box-shadow:
                    4px 4px 0 0 rgba(153, 0, 255, 0.12),
                    -1px -1px 0 0 rgba(124, 92, 252, 0.08);
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 2rem;
                align-items: center;
            }
            .hero::before {
                content: "";
                position: absolute;
                top: -80px;
                right: -80px;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    var(--accent) 0%,
                    transparent 70%
                );
                opacity: 0.06;
                pointer-events: none;
            }
            .hero::after {
                content: "◈";
                position: absolute;
                bottom: 1.2rem;
                right: 1.4rem;
                font-size: 1rem;
                color: var(--accent2);
                opacity: 0.25;
            }
            .hero-scanline {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    var(--accent) 40%,
                    var(--accent2) 60%,
                    transparent 100%
                );
                opacity: 0.5;
            }
            .hero-title {
                font-family: "Josefin Sans", sans-serif;
                font-size: 4rem;
                font-weight: 700;
                line-height: 0.95;
                letter-spacing: -0.01em;
                margin-bottom: 0.9rem;
                color: var(--text);
            }
            .hero-subtitle {
                color: var(--muted);
                font-size: 13.5px;
                line-height: 1.85;
                max-width: 500px;
            }
            .hero-logo {
                width: 110px;
                height: 110px;
                border-radius: 16px 6px 16px 6px;
                overflow: hidden;
                border: 2px solid rgba(153, 0, 255, 0.3);
                background: var(--bg3);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transform: rotate(1.5deg);
                box-shadow:
                    3px 3px 0 rgba(153, 0, 255, 0.14),
                    0 0 24px rgba(153, 0, 255, 0.08);
            }
            .hero-logo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .hero-logo-placeholder {
                font-family: "Josefin Sans", sans-serif;
                font-weight: 700;
                font-size: 2rem;
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: 0.04em;
            }
            .cta-row {
                display: flex;
                flex-wrap: wrap;
                gap: 0.8rem;
                margin-top: 1.6rem;
                align-items: center;
            }
            .cta-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 9px 22px;
                font-family: "Josefin Sans", sans-serif;
                font-size: 0.95rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                border-radius: 3px 10px 4px 8px / 8px 3px 10px 4px;
                cursor: pointer;
                transition:
                    transform 0.18s,
                    box-shadow 0.18s,
                    opacity 0.18s;
                border: none;
                text-decoration: none;
            }
            .cta-primary {
                background: linear-gradient(
                    135deg,
                    var(--accent) 0%,
                    var(--accent2) 100%
                );
                color: #fff;
                box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
                cursor: default;
            }
            .cta-secondary {
                background: transparent;
                color: var(--text);
                border: 1.5px solid rgba(153, 0, 255, 0.3);
            }
            .cta-secondary:hover {
                border-color: var(--accent);
                color: var(--accent);
                transform: translateY(-2px);
                box-shadow: 0 0 14px rgba(153, 0, 255, 0.12);
            }
            .cta-btn svg {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
            }
            .cta-btn img {
                width: 20px;
                height: 20px;
                flex-shrink: 0;
                filter: none !important;
            }
            .banner-tag {
                display: inline-flex;
                align-items: center;
                font-size: 10px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--accent2);
                background: rgba(124, 92, 252, 0.1);
                border: 1px solid rgba(124, 92, 252, 0.28);
                border-radius: 12px 4px 12px 4px / 4px 12px 4px 12px;
                padding: 3px 10px 3px 8px;
                font-family: "Azeret Mono", monospace;
            }

            /* ── SECTION SHARED ── */
            .section-head {
                display: flex;
                align-items: baseline;
                gap: 1rem;
                margin-bottom: 1.5rem;
                position: relative;
            }
            .section-title {
                font-family: "Josefin Sans", sans-serif;
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: 0.01em;
                position: relative;
                padding-bottom: 6px;
            }
            .section-title::after {
                content: "";
                position: absolute;
                left: 0;
                bottom: -2px;
                width: 100%;
                height: 3px;
                background: var(--accent);
                border-radius: 2px;
                opacity: 0.5;
                clip-path: polygon(
                    0 0,
                    4% 100%,
                    8% 0,
                    12% 100%,
                    16% 0,
                    20% 100%,
                    24% 0,
                    28% 100%,
                    32% 0,
                    36% 100%,
                    40% 0,
                    44% 100%,
                    48% 0,
                    52% 100%,
                    56% 0,
                    60% 100%,
                    64% 0,
                    68% 100%,
                    72% 0,
                    76% 100%,
                    80% 0,
                    84% 100%,
                    88% 0,
                    92% 100%,
                    96% 0,
                    100% 100%,
                    100% 100%,
                    0 100%
                );
            }

            /* ── PROJECT DETAILS ── */
            #details-section {
                margin-bottom: 4rem;
            }
            .details-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .detail-card {
                background: var(--bg2);
                border: 1.5px solid rgba(255, 255, 255, 0.08);
                border-radius: 4px 14px 6px 10px / 10px 4px 12px 6px;
                padding: 1.4rem 1.6rem;
                position: relative;
                overflow: hidden;
                box-shadow: 3px 4px 0 0 rgba(153, 0, 255, 0.08);
            }
            .detail-card:nth-child(even) {
                transform: rotate(-0.2deg);
                border-radius: 10px 4px 12px 6px / 4px 14px 6px 10px;
            }
            .detail-card:nth-child(odd) {
                transform: rotate(0.15deg);
            }
            .detail-card-label {
                font-size: 11px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.8;
                font-family: "Azeret Mono", monospace;
                margin-bottom: 0.4rem;
            }
            .detail-card-value {
                font-family: "Josefin Sans", sans-serif;
                font-size: 1.1rem;
                font-weight: 600;
                color: var(--text);
                line-height: 1.4;
            }

            .details-full {
                margin-bottom: 1rem;
                background: var(--bg2);
                border: 1.5px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px 16px 8px 12px / 12px 6px 14px 8px;
                padding: 1.6rem 1.8rem;
                box-shadow: 3px 4px 0 0 rgba(153, 0, 255, 0.08);
                transform: rotate(-0.1deg);
            }
            .details-full-label {
                font-size: 11px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.8;
                font-family: "Azeret Mono", monospace;
                margin-bottom: 0.7rem;
            }
            .details-full p {
                color: var(--muted);
                font-size: 13.5px;
                line-height: 1.9;
            }

            /* ── DEVLOG / UPDATES ── */
            #updates-section {
                margin-bottom: 4rem;
            }
            .update-list {
                display: flex;
                flex-direction: column;
                gap: 0;
                position: relative;
            }
            .update-list::before {
                content: "";
                position: absolute;
                left: 18px;
                top: 24px;
                bottom: 24px;
                width: 2px;
                background: linear-gradient(
                    to bottom,
                    var(--accent) 0%,
                    rgba(124, 92, 252, 0.15) 100%
                );
                border-radius: 2px;
                opacity: 0.35;
            }

            .update-entry {
                display: grid;
                grid-template-columns: 38px 1fr;
                gap: 1.2rem;
                align-items: start;
                padding-bottom: 2rem;
                position: relative;
            }
            .update-entry:last-child {
                padding-bottom: 0;
            }

            .update-dot-col {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 4px;
                flex-shrink: 0;
            }
            .update-dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--accent2);
                border: 2px solid var(--bg);
                box-shadow: 0 0 8px var(--accent-glow);
                flex-shrink: 0;
                z-index: 1;
                position: relative;
            }

            .update-card {
                background: var(--bg2);
                border: 1.5px solid rgba(255, 255, 255, 0.08);
                border-radius: 4px 14px 6px 10px / 10px 4px 12px 6px;
                overflow: hidden;
                box-shadow: 3px 4px 0 0 rgba(153, 0, 255, 0.08);
                transition:
                    border-color 0.25s,
                    transform 0.25s,
                    box-shadow 0.25s;
            }
            .update-entry:nth-child(even) .update-card {
                transform: rotate(-0.2deg);
                border-radius: 10px 4px 12px 6px / 4px 14px 6px 10px;
            }
            .update-entry:nth-child(odd) .update-card {
                transform: rotate(0.15deg);
            }
            .update-card:hover {
                border-color: rgba(153, 0, 255, 0.35);
                transform: translateY(-2px) rotate(0deg) !important;
                box-shadow:
                    4px 7px 0 0 rgba(153, 0, 255, 0.13),
                    0 0 20px rgba(153, 0, 255, 0.07);
            }

            .update-img-wrap {
                height: 300px; /* Increased from default */
                overflow: hidden;
                position: relative;
            }
            
            .update-img-wrap img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* Maintains aspect ratio */
                display: block;
            }
            .update-card:hover .update-img-wrap img {
                transform: scale(1.04);
            }

            .update-body {
                padding: 1.3rem 1.5rem;
            }
            .update-meta {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 0.5rem;
                flex-wrap: wrap;
            }
            .update-date {
                font-size: 11px;
                letter-spacing: 0.07em;
                color: var(--accent);
                font-family: "Azeret Mono", monospace;
                opacity: 0.8;
            }
            .update-num {
                font-size: 10px;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--muted);
                font-family: "Azeret Mono", monospace;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid var(--border);
                border-radius: 10px 3px 10px 3px / 3px 10px 3px 10px;
                padding: 1px 8px;
            }
            .update-title {
                font-family: "Josefin Sans", sans-serif;
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: 0.01em;
                line-height: 1.2;
                margin-bottom: 0.6rem;
                color: var(--text);
            }
            .update-desc {
                color: var(--muted);
                font-size: 13px;
                line-height: 1.85;
            }

            .updates-empty {
                background: var(--bg2);
                border: 1.5px dashed rgba(255, 255, 255, 0.1);
                border-radius: 6px 16px 8px 12px / 12px 6px 14px 8px;
                padding: 2.5rem;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
                opacity: 0.7;
            }

            /* ── INFO ROWS (shared with index) ── */
            .info-row {
                display: flex;
                justify-content: space-between;
                padding: 0.28rem 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                font-size: 12px;
            }
            .info-row:last-child {
                border-bottom: none;
            }
            .info-label {
                color: var(--muted);
            }
            .info-value {
                color: var(--text);
                font-weight: 500;
            }

            /* ── BTN ── */
            .project-btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 7px 18px;
                font-family: "Josefin Sans", sans-serif;
                font-size: 1rem;
                font-weight: 600;
                color: #fff;
                background: var(--accent);
                border: none;
                border-radius: 3px 10px 4px 8px / 8px 3px 10px 4px;
                cursor: pointer;
                transition:
                    opacity 0.2s,
                    transform 0.15s,
                    box-shadow 0.2s;
                align-self: flex-start;
                text-decoration: none;
                letter-spacing: 0.02em;
                box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
            }
            .project-btn:hover {
                opacity: 0.9;
                transform: translateY(-1px);
                box-shadow:
                    3px 5px 0 rgba(0, 0, 0, 0.3),
                    0 0 16px var(--accent-glow);
            }
            .project-btn img {
                width: 14px;
                height: 14px;
                filter: brightness(10);
            }

            /* ── FOOTER (identical to index.html) ── */
            footer {
                border-top: 1.5px solid rgba(153, 0, 255, 0.12);
                padding: 2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 1rem;
                max-width: 920px;
                margin: 0 auto;
            }
            .footer-brand {
                font-family: "Josefin Sans", sans-serif;
                font-weight: 700;
                font-size: 1.1rem;
                color: var(--muted);
                display: inline-block;
            }
            .footer-links {
                display: flex;
                gap: 0.75rem;
                flex-wrap: wrap;
                align-items: center;
            }
            .footer-links img {
                width: 18px;
                height: 18px;
                filter: brightness(0) invert(1) opacity(0.55);
                transition: filter 0.2s;
            }
            .footer-sep {
                color: rgba(255, 255, 255, 0.15);
                font-size: 12px;
            }
            .footer-link {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
                color: var(--muted);
                padding: 5px 12px;
                border-radius: 3px 8px 4px 6px / 6px 3px 8px 4px;
                border: 1px solid var(--border);
                transition:
                    color 0.2s,
                    border-color 0.2s,
                    transform 0.2s;
            }
            .footer-link:hover {
                color: var(--text);
                border-color: rgba(153, 0, 255, 0.3);
                transform: translateY(-1px);
            }
            .footer-link:hover img {
                filter: brightness(0) invert(1) opacity(0.9);
            }
            .footer-link svg {
                width: 15px;
                height: 15px;
            }

            /* ── ANIM ── */
            .anim-in {
                opacity: 0;
                transform: translateY(16px) rotate(0.5deg);
                transition:
                    opacity 0.5s ease,
                    transform 0.5s ease;
            }
            .anim-in.visible {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }

            /* ── RESPONSIVE ── */
            @media (max-width: 640px) {
                .hero {
                    grid-template-columns: 1fr;
                }
                .hero-logo {
                    width: 72px;
                    height: 72px;
                    align-self: start;
                }
                .hero-title {
                    font-size: 2.8rem;
                }
                .details-grid {
                    grid-template-columns: 1fr;
                }
                nav {
                    padding: 0 1rem;
                    gap: 1rem;
                }
                main {
                    padding: 2rem 1rem;
                }
                footer {
                    padding: 2rem 1rem;
                }
                .nav-tabs {
                    display: none;
                }
                .nav-hamburger {
                    display: flex;
                }
                .nav-mobile-menu {
                    display: block;
                }
                .update-list::before {
                    left: 14px;
                }
                .update-entry {
                    grid-template-columns: 30px 1fr;
                    gap: 0.8rem;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="network-canvas"></canvas>

        <!-- ── CONFIG ─────────────────────────────────────────────────── -->
        <script>
            const SITE = {
                name: "Purpyel",
                avatar: "/assets/purpyel-logo.svg",
            };

            const SOCIALS = [
                {
                    label: "GitHub",
                    icon: "github",
                    url: "https://github.com/thePurpyel",
                },
                {
                    label: "Discord",
                    icon: "discord",
                    url: "https://discord.gg/rkSKtdW99R",
                },
                {
                    label: "Ko-fi",
                    icon: "kofi",
                    url: "https://ko-fi.com/purpyel",
                },
            ];

            const NAV_TABS = [
                { label: "Home", url: "/" },
                { label: "NerdLabs AI", url: "/nerdlabs" },
                { label: "WaterBot", url: "/waterbot" },
                { label: "Protogen Head", url: "#banner-section", active: true },
            ];

            /* ── project info ── */
            const PROJECT = {
                tag: "Cosplay",
                title: "Protogen Head",
                desc: "I am working on a protogen head for HHDC 2026. It features a 3D printed base, two LED matrix panels for the face, and a Raspberry Pi as the controller.",
                image: "/assets/protogen-square.avif",
                status: "Finalizing base",
                event: "HHDC summer 2026",
                deadline: "June 20, 2026",
                tech: "3D printed base, LED matrix displays, Raspberry Pi 4",
                details:
                    "This project is a full protogen fursuit head built from scratch. The base is 3D printed, with two 64x32 LED matrix panels mounted on the front as the face. A Raspberry Pi 4 drives the display. The goal is to have it finished and wearable for HHDC summer 2026.",
            };

            const UPDATES = [
                {
                    date: "28-5-2026",
                    title: "Assembling the base pt. 2",
                    desc: "I finished the base by sanding it and adding a fresh layer of paint. I also carved out the ears from a block of foam and cut the fur into shape.",
                    image: "/assets/protogen/updates/protogen-base-2.avif",
                },
                {
                    date: "26-5-2026",
                    title: "Assembling the base",
                    desc: "I melted together the 3D printed parts to form a complete head base. I used some stuff to fill in the gaps, which i forgot the name of, but all i need to do now is to sand it and add another layer of paint and the base will be finished!",
                    image: "/assets/protogen/updates/protogen-base-assembly.avif",
                },
                {
                    date: "8-5-2026",
                    title: "Setting up the displays",
                    desc: "I wired everything up and configured the Raspberry Pi to display a protogen face on the matrix displays. I wrote a simple script to automatically set up the displays on startup, so i can power the face on without any extra interaction.",
                    image: "/assets/protogen/updates/protogen-display.avif",
                },
            ];
        </script>

        <!-- ── NAV ──────────────────────────────────────────────────── -->
        <nav>
            <a href="/" class="nav-logo">
                <img src="/assets/purpyel-logo.svg" alt="Purpyel" />
            </a>
            <div class="nav-tabs" id="nav-tabs"></div>
            <button
                class="nav-hamburger"
                id="nav-hamburger"
                aria-label="Open menu"
                aria-expanded="false"
            >
                <span></span><span></span><span></span>
            </button>
        </nav>
        <div class="nav-mobile-menu" id="nav-mobile-menu" aria-hidden="true">
            <div id="nav-mobile-inner"></div>
        </div>

        <!-- ── MAIN ─────────────────────────────────────────────────── -->
        <main>
            <section id="banner-section">
                <div class="hero anim-in">
                    <div class="hero-scanline"></div>
                    <div class="hero-left">
                        <h1 class="hero-title" id="banner-title-el">—</h1>
                        <p class="hero-subtitle" id="banner-desc-el">—</p>
                        <div class="cta-row" id="cta-row-el"></div>
                    </div>
                    <div class="hero-logo" id="banner-img-el">
                        <span class="hero-logo-placeholder">P</span>
                    </div>
                </div>
            </section>

            <section id="details-section">
                <div class="section-head">
                    <h2 class="section-title">About</h2>
                </div>
                <div
                    class="details-full anim-in"
                    id="details-full"
                    style="display: none"
                >
                    <div class="details-full-label">overview</div>
                    <p id="details-full-text"></p>
                </div>
                <div class="details-grid" id="details-grid"></div>
            </section>

            <section id="updates-section">
                <div class="section-head">
                    <h2 class="section-title">Updates</h2>
                </div>
                <div class="update-list" id="update-list"></div>
            </section>
        </main>

        <!-- ── FOOTER ───────────────────────────────────────────────── -->
        <footer>
            <div class="footer-brand" id="footer-brand">Purpyel</div>
            <div class="footer-links" id="footer-links"></div>
        </footer>

        <!-- ── SCRIPTS ──────────────────────────────────────────────── -->
        <script>
            const ICONS = {
                github: `<img src="/assets/github.svg" alt="GitHub">`,
                discord: `<img src="/assets/discord.svg" alt="Discord">`,
                kofi: `<img src="/assets/kofi.svg" alt="Ko-fi">`,
            };

            document.getElementById("banner-title-el").textContent =
                PROJECT.title;
            document.getElementById("banner-desc-el").textContent =
                PROJECT.desc;

            if (PROJECT.image) {
                document.getElementById("banner-img-el").innerHTML =
                    `<img src="${PROJECT.image}" alt="${PROJECT.title}">`;
            }

            const ctaRow = document.getElementById("cta-row-el");

            const statusChip = document.createElement("span");
            statusChip.className = "banner-tag";
            statusChip.innerHTML = `</span>in progress<span>`;
            ctaRow.appendChild(statusChip);

            if (PROJECT.url) {
                const a = document.createElement("a");
                a.className = "cta-btn cta-secondary";
                a.href = PROJECT.url;
                if (PROJECT.url.startsWith("http")) {
                    a.target = "_blank";
                    a.rel = "noopener";
                }
                a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>GitHub`;
                ctaRow.appendChild(a);
            }

            const detailFields = [
                { label: "status", value: PROJECT.status },
                { label: "event", value: PROJECT.event },
                { label: "deadline", value: PROJECT.deadline },
                { label: "tech", value: PROJECT.tech },
            ].filter((f) => f.value);

            const grid = document.getElementById("details-grid");
            detailFields.forEach((f) => {
                const card = document.createElement("div");
                card.className = "detail-card anim-in";
                card.innerHTML = `<div class="detail-card-label">${f.label}</div><div class="detail-card-value">${f.value}</div>`;
                grid.appendChild(card);
            });

            if (PROJECT.details) {
                const fullEl = document.getElementById("details-full");
                document.getElementById("details-full-text").textContent =
                    PROJECT.details;
                fullEl.style.display = "";
            }

            const updateList = document.getElementById("update-list");

            if (!UPDATES.length) {
                updateList.innerHTML = `<div class="updates-empty">No updates yet — check back soon!</div>`;
            } else {
                UPDATES.forEach((u, i) => {
                    const entry = document.createElement("div");
                    entry.className = "update-entry";

                    const num = String(UPDATES.length - i).padStart(2, "0");

                    entry.innerHTML = `
      <div class="update-dot-col">
        <div class="update-dot"></div>
      </div>
      <div class="update-card anim-in">
        ${u.image ? `<div class="update-img-wrap"><img src="${u.image}" alt="${u.title}" loading="lazy"></div>` : ""}
        <div class="update-body">
          <div class="update-meta">
            <span class="update-date">${u.date}</span>
            <span class="update-num">update #${num}</span>
          </div>
          <h3 class="update-title">${u.title}</h3>
          <p class="update-desc">${u.desc}</p>
        </div>
      </div>`;
                    updateList.appendChild(entry);
                });
            }

            document.getElementById("footer-brand").textContent = SITE.name;

            const navTabs = document.getElementById("nav-tabs");
            const navMobileInner = document.getElementById("nav-mobile-inner");

            function navTabAction(url, e) {
                if (url.startsWith("#")) {
                    document
                        .getElementById(url.slice(1))
                        ?.scrollIntoView({
                            behavior: "smooth",
                            block: "start",
                        });
                } else {
                    url.startsWith("http")
                        ? window.open(url, "_blank", "noopener")
                        : (window.location.href = url);
                }
                closeMobileMenu();
                document
                    .querySelectorAll(".nav-tab, .nav-mobile-item")
                    .forEach((t) => t.classList.remove("active"));
                e?.currentTarget?.classList.add("active");
            }

            NAV_TABS.forEach(tab => {
            const btn = document.createElement('button');
            btn.className = 'nav-tab' + (tab.active ? ' active' : '');
            btn.textContent = tab.label;
            btn.addEventListener('click', e => navTabAction(tab.url, e));
            navTabs.appendChild(btn);

            const mBtn = document.createElement('button');
            mBtn.className = 'nav-mobile-item' + (tab.active ? ' active' : '');
            mBtn.textContent = tab.label;
            mBtn.addEventListener('click', e => navTabAction(tab.url, e));
            navMobileInner.appendChild(mBtn);
            });

            const hamburger = document.getElementById("nav-hamburger");
            const mobileMenu = document.getElementById("nav-mobile-menu");

            function closeMobileMenu() {
                hamburger.classList.remove("open");
                mobileMenu.classList.remove("open");
                hamburger.setAttribute("aria-expanded", "false");
                mobileMenu.setAttribute("aria-hidden", "true");
            }
            hamburger.addEventListener("click", () => {
                const isOpen = mobileMenu.classList.contains("open");
                if (isOpen) {
                    closeMobileMenu();
                } else {
                    hamburger.classList.add("open");
                    mobileMenu.classList.add("open");
                    hamburger.setAttribute("aria-expanded", "true");
                    mobileMenu.setAttribute("aria-hidden", "false");
                }
            });
            document.addEventListener("click", (e) => {
                if (
                    !hamburger.contains(e.target) &&
                    !mobileMenu.contains(e.target)
                )
                    closeMobileMenu();
            });

            const footerLinks = document.getElementById("footer-links");
            SOCIALS.forEach((s, i) => {
                if (i > 0) {
                    const sep = document.createElement("span");
                    sep.className = "footer-sep";
                    sep.textContent = "|";
                    footerLinks.appendChild(sep);
                }
                const a = document.createElement("a");
                a.className = "footer-link";
                a.href = s.url;
                if (s.url.startsWith("http")) {
                    a.target = "_blank";
                    a.rel = "noopener";
                }
                a.innerHTML = `${ICONS[s.icon] || ""} ${s.label}`;
                footerLinks.appendChild(a);
            });

            /* ── intersection observer ── */
            const obs = new IntersectionObserver(
                (entries) => {
                    entries.forEach((e) => {
                        if (e.isIntersecting) {
                            e.target.classList.add("visible");
                            obs.unobserve(e.target);
                        }
                    });
                },
                { threshold: 0.06 },
            );
            document
                .querySelectorAll(".anim-in")
                .forEach((el) => obs.observe(el));

            (function initNetwork() {
                const canvas = document.getElementById("network-canvas");
                const ctx = canvas.getContext("2d");
                let particles = [];
                const COUNT = 55;
                const MAX_DIST = 140;

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                function makeParticle() {
                    return {
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.38,
                        vy: (Math.random() - 0.5) * 0.38,
                        r: Math.random() * 1.8 + 0.6,
                    };
                }
                function init() {
                    resize();
                    particles = [];
                    for (let i = 0; i < COUNT; i++)
                        particles.push(makeParticle());
                }
                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (const p of particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    }
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const a = particles[i],
                                b = particles[j];
                            const dx = a.x - b.x,
                                dy = a.y - b.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < MAX_DIST) {
                                const alpha = (1 - dist / MAX_DIST) * 0.22;
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(153, 0, 255, ${alpha})`;
                                ctx.lineWidth = 0.8;
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.stroke();
                            }
                        }
                    }
                    for (const p of particles) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(124, 92, 252, 0.55)";
                        ctx.fill();
                    }
                    requestAnimationFrame(draw);
                }
                window.addEventListener("resize", resize);
                init();
                draw();
            })();
        </script>
    </body>
</html>
