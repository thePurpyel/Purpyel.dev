<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purpyel</title>
<link rel="icon" type="image/png" href="/assets/purpyel-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:         #0d0d10;
    --bg2:        #16161c;
    --bg3:        #1e1e27;
    --border:     rgba(255,255,255,0.08);
    --border2:    rgba(255,255,255,0.15);
    --text:       #e8e8f0;
    --muted:      #8888a4;
    --accent:     #9900ff;
    --accent2:    #7c5cfc;
    --accent-glow: rgba(153, 0, 255, 0.35);
    --radius:     4px 14px 6px 10px / 8px 4px 12px 6px;
    --radius-sm:  3px 8px 5px 6px / 6px 3px 8px 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Azeret Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 15px;
    line-height: 1.7;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; width: 100%; }

  #network-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  body > *:not(#network-canvas):not(nav):not(.nav-mobile-menu) { position: relative; z-index: 1; }

  .svg-filters { position: absolute; width: 0; height: 0; overflow: hidden; }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(13,13,16,0.88);
    border-bottom: 1.5px solid rgba(153,0,255,0.15);
    padding: 0 2rem;
    height: 62px;
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  body { padding-top: 62px; }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    flex-shrink: 0;
    transform: rotate(-1deg);
    transition: transform 0.2s;
  }
  .nav-logo:hover { transform: rotate(0.5deg) scale(1.04); }
  .nav-logo img {
    width: 32px;
    height: 32px;
    border-radius: 8px 4px 8px 4px;
    object-fit: cover;
  }
  .nav-tabs {
    display: flex;
    gap: 0.25rem;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab {
    padding: 4px 14px;
    font-size: 13px;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.2s, background 0.2s;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    background: transparent;
    border-radius: 3px 8px 4px 6px / 5px 3px 7px 4px;
    position: relative;
    letter-spacing: 0.02em;
  }
  .nav-tab::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 10%;
    width: 0%;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.25s ease;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab:hover::after { width: 80%; }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active::after { width: 80%; }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 36px;
    height: 36px;
    padding: 5px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 4px 10px 5px 8px / 8px 4px 10px 5px;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: auto;
    transition: border-color 0.2s;
  }
  .nav-hamburger:hover { border-color: rgba(153,0,255,0.5); }
  .nav-hamburger span {
    display: block;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s ease;
    transform-origin: center;
  }
  .nav-hamburger span:nth-child(2) { width: 75%; }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .nav-mobile-menu {
    display: none;
    position: fixed;
    top: 62px;
    left: 0;
    width: 100%;
    z-index: 99;
    background: rgba(13,13,16,0.97);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1.5px solid rgba(153,0,255,0.2);
    padding: 0.75rem 1rem 1rem;
    transform: translateY(-8px);
    opacity: 0;
    transition: transform 0.22s ease, opacity 0.22s ease;
    pointer-events: none;
  }
  .nav-mobile-menu.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .nav-mobile-item {
    display: block;
    width: 100%;
    padding: 0.75rem 0.5rem;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    text-align: left;
    letter-spacing: 0.02em;
    transition: color 0.2s, padding-left 0.2s;
  }
  .nav-mobile-item:last-child { border-bottom: none; }
  .nav-mobile-item:hover { color: var(--text); padding-left: 1rem; }
  .nav-mobile-item.active { color: var(--accent); }

  main { max-width: 920px; margin: 0 auto; padding: 4rem 2rem 2rem; }

  .about {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2rem;
    align-items: start;
    padding: 2.5rem;
    background: var(--bg2);
    border: 1.5px solid rgba(153,0,255,0.18);
    border-radius: 4px 18px 8px 14px / 10px 6px 16px 4px;
    margin-bottom: 4rem;
    position: relative;
    overflow: hidden;
    box-shadow:
      4px 4px 0 0 rgba(153,0,255,0.12),
      -1px -1px 0 0 rgba(124,92,252,0.08);
  }
  .about::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
    opacity: 0.07;
    pointer-events: none;
  }
  .about::after {
    content: '✦';
    position: absolute;
    bottom: 1.2rem; right: 1.4rem;
    font-size: 1rem;
    color: var(--accent2);
    opacity: 0.3;
  }
  .about-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.6rem;
    font-family: 'Azeret Mono', monospace;
    font-weight: 400;
    opacity: 0.85;
  }
  .about-name {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.01em;
    margin-bottom: 1rem;
  }
  .about-bio {
    color: var(--muted);
    max-width: 520px;
    font-size: 13.5px;
    line-height: 1.85;
  }
  .about-avatar {
    width: 86px;
    height: 86px;
    border-radius: 8px 4px 10px 6px / 6px 10px 4px 8px;
    overflow: hidden;
    border: 2px solid rgba(153,0,255,0.3);
    flex-shrink: 0;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 28px;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    transform: rotate(1.5deg);
    box-shadow: 3px 3px 0 rgba(153,0,255,0.15);
  }
  .about-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
    position: relative;
  }
  .section-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    position: relative;
    padding-bottom: 6px;
  }
  .section-title::after {
    content: '';
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    opacity: 0.5;
    clip-path: polygon(0 0,4% 100%,8% 0,12% 100%,16% 0,20% 100%,24% 0,28% 100%,32% 0,36% 100%,40% 0,44% 100%,48% 0,52% 100%,56% 0,60% 100%,64% 0,68% 100%,72% 0,76% 100%,80% 0,84% 100%,88% 0,92% 100%,96% 0,100% 100%,100% 100%,0 100%);
  }

  #projects-section { margin-bottom: 4rem; }
  .project-list { display: flex; flex-direction: column; gap: 1.2rem; }

  .project-card {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 0;
    background: var(--bg2);
    border: 1.5px solid rgba(255,255,255,0.09);
    border-radius: 4px 14px 6px 10px / 10px 4px 12px 6px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    box-shadow: 3px 4px 0 0 rgba(153,0,255,0.08);
  }
  .project-card:nth-child(even) {
    transform: rotate(-0.25deg);
    border-radius: 10px 4px 12px 6px / 4px 14px 6px 10px;
  }
  .project-card:nth-child(odd) {
    transform: rotate(0.2deg);
  }
  .project-card:hover {
    border-color: rgba(153,0,255,0.4);
    transform: translateY(-3px) rotate(0deg) !important;
    box-shadow: 5px 8px 0 0 rgba(153,0,255,0.15), 0 0 24px rgba(153,0,255,0.08);
  }
  .project-banner {
    height: 100%;
    min-height: 155px;
    overflow: hidden;
    background: var(--bg3);
    position: relative;
  }
  .project-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .project-card:hover .project-banner img { transform: scale(1.06); }
  .project-banner-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 3rem;
    color: var(--border2);
  }
  .project-body {
    padding: 1.4rem 1.6rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .project-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent2);
    background: rgba(124,92,252,0.1);
    border: 1px solid rgba(124,92,252,0.28);
    border-radius: 12px 4px 12px 4px / 4px 12px 4px 12px;
    padding: 3px 10px 3px 8px;
    margin-bottom: 0.2rem;
    font-family: 'Azeret Mono', monospace;
  }

  .project-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.15;
  }
  .project-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
    flex: 1;
  }

  .project-info {
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 0.28rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 12px;
  }
  .info-label { color: var(--muted); }
  .info-value { color: var(--text); font-weight: 500; }

  .project-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 0.6rem;
    padding: 7px 18px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 3px 10px 4px 8px / 8px 3px 10px 4px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    align-self: flex-start;
    text-decoration: none;
    letter-spacing: 0.02em;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.3);
  }
  .project-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 3px 5px 0 rgba(0,0,0,0.3), 0 0 16px var(--accent-glow);
  }
  .project-btn img { width: 14px; height: 14px; filter: brightness(10); }

  #nerdlabs-section { margin-bottom: 4rem; }
  .nerdlabs-card {
    display: grid;
    grid-template-columns: 260px 1fr;
    background: var(--bg2);
    border: 1.5px solid rgba(153,0,255,0.18);
    border-radius: 10px 4px 14px 6px / 4px 12px 6px 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 4px 5px 0 0 rgba(153,0,255,0.1);
    transform: rotate(-0.15deg);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .nerdlabs-card:hover {
    transform: rotate(0deg) translateY(-3px);
    box-shadow: 6px 8px 0 0 rgba(153,0,255,0.18);
  }
  .nerdlabs-card::before {
    content: '';
    position: absolute;
    bottom: -30px; right: 30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--accent2);
    opacity: 0.05;
    pointer-events: none;
  }
  .nerdlabs-banner {
    min-height: 200px;
    overflow: hidden;
    background: var(--bg3);
    position: relative;
  }
  .nerdlabs-banner img { width: 100%; height: 100%; object-fit: cover; }
  .nerdlabs-banner-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--border2);
    letter-spacing: 0.05em;
    text-align: center;
    padding: 1rem;
  }
  .nerdlabs-body {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.75rem;
  }
  .nerdlabs-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent2);
    font-weight: 400;
    font-family: 'Azeret Mono', monospace;
    opacity: 0.8;
  }
  .nerdlabs-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  .nerdlabs-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.85;
  }

  footer {
    border-top: 1.5px solid rgba(153,0,255,0.12);
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    max-width: 920px;
    margin: 0 auto;
  }
  .footer-brand {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--muted);
    display: inline-block;
  }
  .footer-links {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .footer-links img {
    width: 18px;
    height: 18px;
    filter: brightness(0) invert(1) opacity(0.55);
    transition: filter 0.2s;
  }

  .footer-sep {
    color: rgba(255,255,255,0.15);
    font-size: 12px;
  }
  .footer-link {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 3px 8px 4px 6px / 6px 3px 8px 4px;
    border: 1px solid var(--border);
    transition: color 0.2s, border-color 0.2s, transform 0.2s;
  }
  .footer-link:hover {
    color: var(--text);
    border-color: rgba(153,0,255,0.3);
    transform: translateY(-1px);
  }

  .footer-link:hover img {
    filter: brightness(0) invert(1) opacity(0.9);
  }

  .footer-link svg { width: 15px; height: 15px; }

  .anim-in {
    opacity: 0;
    transform: translateY(16px) rotate(0.5deg);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .anim-in.visible {
    opacity: 1;
    transform: translateY(0) rotate(0deg);
  }
  .project-card:nth-child(even).anim-in { transform: translateY(16px) rotate(-0.25deg); }
  .project-card:nth-child(even).anim-in.visible { transform: translateY(0) rotate(-0.25deg); }
  .project-card:nth-child(odd).anim-in  { transform: translateY(16px) rotate(0.2deg); }
  .project-card:nth-child(odd).anim-in.visible  { transform: translateY(0) rotate(0.2deg); }

  .site-notice {
    background: rgba(153, 0, 255, 0.08);
    border-bottom: 1.5px solid rgba(153, 0, 255, 0.2);
    padding: 0.65rem 2rem;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .site-notice strong { color: var(--accent); font-weight: 600; }

  .coming-soon-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.28);
    border-radius: 12px 4px 12px 4px / 4px 12px 4px 12px;
    padding: 2px 8px 2px 6px;
    margin-left: 0.4rem;
    font-family: 'Azeret Mono', monospace;
  }

  @media (max-width: 640px) {
    .about { grid-template-columns: 1fr; }
    .about-avatar { width: 64px; height: 64px; align-self: start; }
    .about-name { font-size: 2.4rem; }
    .project-card { grid-template-columns: 1fr; }
    .project-banner { min-height: 150px; }
    .nerdlabs-card { grid-template-columns: 1fr; }
    .nerdlabs-banner { min-height: 160px; }
    nav { padding: 0 1rem; gap: 1rem; }
    main { padding: 2rem 1rem; }
    footer { padding: 2rem 1rem; }
    .nav-tabs { display: none; }
    .nav-hamburger { display: flex; }
    .nav-mobile-menu { display: block; }
  }
</style>
</head>
<body>

<canvas id="network-canvas"></canvas>

<script>

  /* ── project template ────────────────────────

const navTabs = document.getElementById('nav-tabs');
const navMobileInner = document.getElementById('nav-mobile-inner');

function navTabAction(url, e) {
  if (url.startsWith('#')) {
    document.getElementById(url.slice(1))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    url.startsWith('http') ? window.open(url, '_blank', 'noopener') : window.location.href = url;
  }
  closeMobileMenu();
  document.querySelectorAll('.nav-tab, .nav-mobile-item').forEach(t => t.classList.remove('active'));
  e?.currentTarget?.classList.add('active');
}

NAV_TABS.forEach((tab, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-tab' + (i === 0 ? ' active' : '');
  btn.textContent = tab.label;
  btn.addEventListener('click', e => navTabAction(tab.url, e));
  navTabs.appendChild(btn);

  const mBtn = document.createElement('button');
  mBtn.className = 'nav-mobile-item' + (i === 0 ? ' active' : '');
  mBtn.textContent = tab.label;
  mBtn.addEventListener('click', e => navTabAction(tab.url, e));
  navMobileInner.appendChild(mBtn);
});

const hamburger = document.getElementById('nav-hamburger');
const mobileMenu = document.getElementById('nav-mobile-menu');

function closeMobileMenu() {
  hamburger.classList.remove('open');
  mobileMenu.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  mobileMenu.setAttribute('aria-hidden', 'true');
}

hamburger.addEventListener('click', () => {
  const isOpen = mobileMenu.classList.contains('open');
  if (isOpen) {
    closeMobileMenu();
  } else {
    hamburger.classList.add('open');
    mobileMenu.classList.add('open');
    hamburger.setAttribute('aria-expanded', 'true');
    mobileMenu.setAttribute('aria-hidden', 'false');
  }
});

document.addEventListener('click', (e) => {
  if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) {
    closeMobileMenu();
  }
});

const footerLinks = document.getElementById('footer-links');
SOCIALS.forEach((s, i) => {

  const a = document.createElement('a');

  if (s.url.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = `${ICONS[s.icon] || ''} ${s.label}`;
  footerLinks.appendChild(a);
});

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
  });
}, { threshold: 0.08 });
document.querySelectorAll('.anim-in').forEach(el => obs.observe(el));

(function initNetwork() {
  const canvas = document.getElementById('network-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const COUNT = 55;
  const MAX_DIST = 140;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x:  Math.random() * canvas.width,
      y:  Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.38,
      vy: (Math.random() - 0.5) * 0.38,
      r:  Math.random() * 1.8 + 0.6
    };
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < COUNT; i++) particles.push(makeParticle());
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MAX_DIST) {
          const alpha = (1 - dist / MAX_DIST) * 0.22;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(153, 0, 255, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124, 92, 252, 0.55)';
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>
